<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Phrasync">
  <title>Phrasync</title>
  <defs>
    <linearGradient id="phrase" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff3d7f"/>
      <stop offset="1" stop-color="#8f5bff"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="#0b0a13"/>
  <!-- two staggered lyric lines crossed by the playhead: the product in one mark -->
  <g fill="url(#phrase)">
    <rect x="11" y="18" width="30" height="9" rx="4.5"/>
    <rect x="19" y="38" width="34" height="9" rx="4.5"/>
  </g>
  <rect x="32" y="11" width="5" height="42" rx="2.5" fill="#fff0f7"/>
</svg>
